upstream xray_panel_service {
    server 100.112.13.103:18080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name sub.xray.zrhe2016.cc;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sub.xray.zrhe2016.cc;

    ssl_certificate /run/nginx-certs/fullchain.pem;
    ssl_certificate_key /run/nginx-certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://xray_panel_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
