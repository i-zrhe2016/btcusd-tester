map $uri $static_cache_control {
    default "";
    /index.html "no-cache";
    "~^/assets/.+-[A-Za-z0-9_-]{8,}\\.(js|css|woff2?|png|jpe?g|svg|webp|ico)$" "public, max-age=31536000, immutable";
}

upstream market_data_service {
    server market-data:8081;
}

upstream backtest_service {
    server backtest:8082;
}

# Generated by scripts/generate-http-nginx.mjs. Serve HTTP for the Tailnet port override.
server {
    listen 80;
    listen [::]:80;
    server_name _;


    server_tokens off;
    root /usr/share/nginx/html;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/wasm;
    client_max_body_size 1m;

    add_header Cache-Control $static_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://working-minnow-9177.clerk.accounts.dev https://challenges.cloudflare.com https://*.protect.clerk.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://img.clerk.com; font-src 'self' data:; connect-src 'self' https://working-minnow-9177.clerk.accounts.dev https://*.protect.clerk.com:* https://clerk-telemetry.com; worker-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com https://*.protect.clerk.com" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/backtests {
        proxy_pass http://backtest_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/backtests/ {
        proxy_pass http://backtest_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/configs {
        proxy_pass http://backtest_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/configs/ {
        proxy_pass http://backtest_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/market/ {
        proxy_pass http://market_data_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

