name: CI and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      connection_test:
        description: Test Tailscale SSH without deploying
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: POSTGRES_PASSWORD=ci-only docker compose config --quiet
      - name: Deployment regression tests
        run: python3 -I deployment/test_deploy_release.py

  connection-test:
    if: github.event_name == 'workflow_dispatch' && inputs.connection_test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'deploy.taile2c45c.ts.net' }}
    steps:
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Verify Tailscale login
        run: |
          tailscale status --json | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s.get("BackendState") == "Running", "Tailscale login failed: check OAuth tag:ci permission and tailnet policy"'
      - name: Verify SSH and production health
        run: |
          timeout 60 tailscale ssh "root@$DEPLOY_HOST" 'set -eu; cd /opt/btcusd-tester; docker compose ps; curl -fsS --max-time 15 http://localhost:8083/healthz; curl -fsS --max-time 30 http://localhost:8083/api/market/meta > /dev/null'

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.connection_test
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'deploy.taile2c45c.ts.net' }}
    steps:
      - uses: actions/checkout@v4
      - name: Connect to deployment network
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Verify Tailscale login
        run: |
          tailscale status --json | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s.get("BackendState") == "Running", "Tailscale login failed: check OAuth tag:ci permission and tailnet policy"'
      - name: Package tracked source
        run: git archive --format=tar.gz -o /tmp/release.tar.gz HEAD
      - name: Upload release
        run: |
          tailscale ssh "root@$DEPLOY_HOST" "cat > /tmp/btcusd-release-$GITHUB_SHA.tar.gz" < /tmp/release.tar.gz
      - name: Deploy and verify
        run: |
          tailscale ssh "root@$DEPLOY_HOST" "tar -xOf '/tmp/btcusd-release-$GITHUB_SHA.tar.gz' deployment/deploy-release.sh > '/tmp/btcusd-deploy-$GITHUB_SHA.sh' && bash '/tmp/btcusd-deploy-$GITHUB_SHA.sh' '$GITHUB_SHA'" </dev/null
          deployed_revision=$(tailscale ssh "root@$DEPLOY_HOST" 'cat /opt/btcusd-tester/.deployed-revision' </dev/null)
          if [ "$deployed_revision" != "$GITHUB_SHA" ]; then
            printf 'Deployment revision mismatch: expected %s, got %s\n' "$GITHUB_SHA" "$deployed_revision" >&2
            exit 1
          fi
