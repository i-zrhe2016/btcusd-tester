name: CI and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Run checks only, deploy main, or test the production connection
        type: choice
        options: [checks, deploy, connection-test]
        default: checks

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      payments: ${{ steps.filter.outputs.payments }}
      market_data: ${{ steps.filter.outputs.market_data }}
      backtest: ${{ steps.filter.outputs.backtest }}
      rust_shared: ${{ steps.filter.outputs.rust_shared }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            web:
              - 'frontend/**'
              - 'deployment/nginx/**'
            payments:
              - 'services/payments/**'
            market_data:
              - 'services/market-data/**'
            backtest:
              - 'services/backtest/**'
            rust_shared:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'services/crypto_symbols.rs'
            deploy:
              - 'frontend/**'
              - 'services/**'
              - 'deployment/**'
              - 'scripts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'docker-compose*.yml'
              - '.dockerignore'

  test-web:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-project
        with:
          node-version: '24'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  test-payments:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.payments == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-project
        with:
          node-version: '22'
          cache-dependency-path: services/payments/package-lock.json
      - run: npm ci
        working-directory: services/payments
      - run: npm test
        working-directory: services/payments

  lint-rust:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.market_data == 'true'
      || needs.changes.outputs.backtest == 'true'
      || needs.changes.outputs.rust_shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-market-data:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.market_data == 'true'
      || needs.changes.outputs.rust_shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - run: cargo test -p market-data-service --locked

  test-backtest:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.backtest == 'true'
      || needs.changes.outputs.rust_shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - run: cargo test -p backtest-service --locked

  deploy-checks:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: POSTGRES_PASSWORD=ci-only docker compose config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-history-sync.txt
      - name: Install history sync dependencies
        run: pip install -r requirements-history-sync.txt
      - name: Deployment regression tests
        run: python3 -I deployment/test_deploy_release.py
      - name: History sync unit tests
        run: |
          python3 -I scripts/test_sync_live_market.py
          python3 -I scripts/test_sync_crypto_history.py

  build-web:
    needs: changes
    if: >-
      always() && needs.changes.result == 'success'
      && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          build-args: VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-payments:
    needs: changes
    if: >-
      always() && needs.changes.result == 'success'
      && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.payments == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build payments image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/payments/Dockerfile
          push: false
          cache-from: type=gha,scope=payments
          cache-to: type=gha,mode=max,scope=payments

  build-market-data:
    needs: changes
    if: >-
      always() && needs.changes.result == 'success'
      && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && (github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.market_data == 'true'
      || needs.changes.outputs.rust_shared == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build market-data image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/market-data/Dockerfile
          push: false
          cache-from: type=gha,scope=market-data
          cache-to: type=gha,mode=max,scope=market-data

  build-backtest:
    needs: changes
    if: >-
      always() && needs.changes.result == 'success'
      && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && (github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.backtest == 'true'
      || needs.changes.outputs.rust_shared == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backtest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backtest/Dockerfile
          push: false
          cache-from: type=gha,scope=backtest
          cache-to: type=gha,mode=max,scope=backtest

  connection-test:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'connection-test'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'deploy.taile2c45c.ts.net' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tailscale-connect
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
      - name: Verify SSH and production health
        run: |
          timeout 60 tailscale ssh "root@$DEPLOY_HOST" 'set -eu; cd /opt/btcusd-tester; docker compose ps; curl -fsS --max-time 15 http://localhost:8083/healthz; curl -fsS --max-time 30 http://localhost:8083/api/market/meta > /dev/null'

  deploy:
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.changes.result == 'success'
      && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy == 'true')
      && (github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy')
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs:
      - changes
      - test-web
      - test-payments
      - lint-rust
      - test-market-data
      - test-backtest
      - deploy-checks
      - build-web
      - build-payments
      - build-market-data
      - build-backtest
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'deploy.taile2c45c.ts.net' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tailscale-connect
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
      - name: Select services to rebuild
        id: services
        env:
          WEB: ${{ needs.changes.outputs.web }}
          PAYMENTS: ${{ needs.changes.outputs.payments }}
          MARKET_DATA: ${{ needs.changes.outputs.market_data }}
          BACKTEST: ${{ needs.changes.outputs.backtest }}
          RUST_SHARED: ${{ needs.changes.outputs.rust_shared }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          services=()
          if [ "$DISPATCH" = true ] || [ "$WEB" = true ]; then services+=(web); fi
          if [ "$DISPATCH" = true ] || [ "$PAYMENTS" = true ]; then services+=(payments); fi
          if [ "$DISPATCH" = true ] || [ "$MARKET_DATA" = true ] || [ "$RUST_SHARED" = true ]; then services+=(market-data); fi
          if [ "$DISPATCH" = true ] || [ "$BACKTEST" = true ] || [ "$RUST_SHARED" = true ]; then services+=(backtest); fi
          printf 'list=%s\n' "${services[*]}" >> "$GITHUB_OUTPUT"
      - name: Package tracked source
        run: git archive --format=tar.gz -o /tmp/release.tar.gz HEAD
      - name: Upload release
        run: |
          tailscale ssh "root@$DEPLOY_HOST" "cat > /tmp/btcusd-release-$GITHUB_SHA.tar.gz" < /tmp/release.tar.gz
      - name: Deploy and verify
        timeout-minutes: 35
        env:
          BUILD_SERVICES: ${{ steps.services.outputs.list }}
        run: bash deployment/deploy-ci.sh
